name: BasBas APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # android/ klasörü repoda tutulmaz; her derlemede Flutter üretir.
      - name: Android projesini üret
        run: |
          flutter create --platforms=android --org com.ozgur --project-name basbas .
          rm -rf test

      - name: Manifesti düzenle (internet izni + uygulama adı)
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perm = '<uses-permission android:name="android.permission.INTERNET"/>'
          if perm not in s:
              s = s.replace('<application', perm + '\n    <application', 1)
          s = s.replace('android:label="basbas"', 'android:label="BasBas"')
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -n "INTERNET\|android:label" android/app/src/main/AndroidManifest.xml

      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD veya KEY_ALIAS secret'ı eksik."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties

      - name: Gradle'a imza ayarını ekle
        run: |
          python3 - <<'PY'
          p = 'android/app/build.gradle.kts'
          s = open(p, encoding='utf-8').read()
          header = (
              'import java.util.Properties\n\n'
              'val keystoreProperties = Properties().apply {\n'
              '    val f = rootProject.file("key.properties")\n'
              '    if (f.exists()) load(f.inputStream())\n'
              '}\n\n'
          )
          signing = (
              'signingConfigs {\n'
              '        create("release") {\n'
              '            keyAlias = keystoreProperties["keyAlias"] as String\n'
              '            keyPassword = keystoreProperties["keyPassword"] as String\n'
              '            storeFile = file("release.jks")\n'
              '            storePassword = keystoreProperties["storePassword"] as String\n'
              '        }\n'
              '    }\n\n'
              '    buildTypes {'
          )
          assert 'buildTypes {' in s, 'buildTypes bulunamadi'
          assert 'signingConfig = signingConfigs.getByName("debug")' in s, 'debug imza satiri bulunamadi'
          s = s.replace('buildTypes {', signing, 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")',
                        'signingConfig = signingConfigs.getByName("release")')
          open(p, 'w', encoding='utf-8').write(header + s)
          PY

      - run: flutter pub get

      - name: APK derle
        run: >
          flutter build apk --release
          --target-platform android-arm64
          --build-number=${{ github.run_number }}
          --build-name=1.0.${{ github.run_number }}

      - name: APK adını düzelt
        run: cp build/app/outputs/flutter-apk/app-release.apk basbas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: basbas-apk
          path: basbas.apk

      # Oyundaki "Güncellemeyi kontrol et" butonu bu release'i okur.
      - name: GitHub Release oluştur
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          gh release create "build-${{ github.run_number }}" basbas.apk \
            --title "BasBas build ${{ github.run_number }}" \
            --notes "${COMMIT_MESSAGE:-BasBas yeni sürüm}" \
            --latest
